<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#060e1d"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="40" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .radar-sweep {
        transform-origin: 1040px 180px;
        animation: rotateSweep 8s linear infinite;
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      .float-line {
        stroke-dasharray: 8 6;
        animation: dashMove 20s linear infinite;
      }
      .stream-flow {
        animation: streamFlow 4s ease-in-out infinite;
      }
      .beacon-ring {
        transform-origin: 1040px 180px;
        animation: ringExpand 4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      .pill-hover {
        transition: transform 0.3s;
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.9; transform: scale(1.02); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -200; }
      }
      @keyframes ringExpand {
        0% { r: 10px; opacity: 0.8; }
        100% { r: 120px; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Animated Background Radar & Network Topology -->
  <g opacity="0.65">
    <!-- Concentric Tactical Radar Rings -->
    <circle cx="1040" cy="180" r="130" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="1040" cy="180" r="90" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <circle cx="1040" cy="180" r="50" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="1040" cy="180" r="15" fill="#0284c7" fill-opacity="0.3"/>
    
    <!-- Radar Expanding Waves -->
    <circle class="beacon-ring" cx="1040" cy="180" r="20" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Rotating Radar Sector Line -->
    <g class="radar-sweep">
      <line x1="1040" y1="180" x2="1040" y2="50" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)"/>
      <polygon points="1040,180 1020,60 1040,50" fill="#00f2fe" fill-opacity="0.15"/>
    </g>

    <!-- Logistics Network Mesh & Nodes -->
    <path class="float-line" d="M 60,300 Q 250,220 480,260 T 820,160 T 1040,180" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.4"/>
    <path class="float-line" d="M 120,60 Q 380,110 650,80 T 1040,180" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" style="animation-duration: 25s;"/>
    <path d="M 850,290 L 1040,180 L 980,70" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Mesh Waypoints / Supply Nodes -->
    <circle cx="480" cy="260" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="820" cy="160" r="4.5" fill="#00f2fe" filter="url(#glow)"/>
    <circle cx="650" cy="80" r="3.5" fill="#38bdf8"/>
    <circle cx="980" cy="70" r="4" fill="#818cf8"/>
    <circle cx="850" cy="290" r="4" fill="#38bdf8"/>
    <circle cx="1040" cy="180" r="6" fill="#00f2fe" filter="url(#glow)"/>
  </g>

  <!-- Flow Light Beam -->
  <line x1="60" y1="358" x2="1140" y2="358" stroke="url(#streamGrad)" stroke-width="2"/>

  <!-- Foreground Content: Unobscured Title, Subtitle, & Status Badges -->
  <g transform="translate(60, 48)">
    
    <!-- Top System Category Capsule -->
    <g transform="translate(0, 0)">
      <rect width="320" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="14" cy="14" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">SECURE DEFENSE SUPPLY PIPELINES</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Intelligent Autonomous Defense Logistics
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="118" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400">
      Contested Logistics • Autonomous Multi-Domain Resupply • Predictive Maintenance Orchestration
    </text>

    <text x="0" y="142" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">
      Curated ecosystem of mission-critical defense SaaS platforms and open-source command stacks
    </text>

    <!-- Feature Pillars / Badges in Foreground -->
    <g transform="translate(0, 182)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Contested Routing</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect width="200" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Zero-Trust Verification</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(404, 0)">
        <rect width="190" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 Autonomous Swarms</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(606, 0)">
        <rect width="190" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="14" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛰️ Degraded Comms (PACE)</text>
      </g>
    </g>

    <!-- Subtle Technical Spec Bar -->
    <g transform="translate(0, 242)">
      <text x="0" y="0" fill="#0284c7" font-family="'SF Mono', Menlo, Consolas, Monaco, monospace" font-size="11" font-weight="500" letter-spacing="0.5">
        AIR-GAPPED READY  •  MIL-STD-810  •  ITAR / CMMC COMPLIANT STACKS  •  EDGE INFERENCE
      </text>
    </g>
  </g>
</svg>
